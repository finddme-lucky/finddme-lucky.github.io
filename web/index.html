<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>finddme-lucky</title>
<link rel="stylesheet" href="app.css">
<meta name="theme-color" content="#1b2430">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
<noscript><p class="error">이 앱은 자바스크립트가 필요합니다 — 브라우저 설정에서 켜 주세요.</p></noscript>
<header class="top"><h1>finddme lucky</h1></header>
<main>
  <p id="boot" class="error">화면을 불러오지 못했습니다 — 새로고침하거나 온라인에서 다시 열어 주세요.
    <button id="reset" type="button" style="margin-left:8px">캐시 비우고 다시 열기</button>
    <span id="why"></span>
  </p>
  <script>
  // 일반 스크립트다 (모듈이 아니다) — 모듈 그래프가 통째로 실패해도 이 코드는 실행된다.
  // 무엇이 실패했는지 화면에 적고, 낡은 서비스워커 캐시에 갇혔을 때 빠져나갈 길을 준다.
  addEventListener("error", function (event) {
    var why = document.getElementById("why");
    if (!why) return;
    var target = event.target;
    var detail = target && target.src ? target.src + " 를 불러오지 못했습니다" : event.message;
    why.textContent = " — " + detail;
  }, true);

  document.getElementById("reset").addEventListener("click", function () {
    var done = Promise.resolve();
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      done = navigator.serviceWorker.getRegistrations().then(function (regs) {
        return Promise.all(regs.map(function (reg) { return reg.unregister(); }));
      });
    }
    done.then(function () {
      return window.caches ? caches.keys().then(function (names) {
        return Promise.all(names.map(function (name) { return caches.delete(name); }));
      }) : null;
    }).catch(function () {}).then(function () { location.reload(true); });
  });
  </script>
  <section id="tab-home" class="tab" hidden></section>
  <section id="tab-sets" class="tab" hidden></section>
  <section id="tab-stats" class="tab" hidden></section>
</main>
<nav class="tabbar">
  <a href="#home" data-tab="home">홈</a>
  <a href="#sets" data-tab="sets">이번 주 번호</a>
  <a href="#stats" data-tab="stats">통계</a>
</nav>
<script type="module" src="js/app.mjs"></script>
</body>
</html>
